version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hunterhub-postgres
    restart: always
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: hunterpassword
      POSTGRES_DB: hunterhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: